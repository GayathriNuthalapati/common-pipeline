name: Reusable Workflow To Deploy MuleSoft Application

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment whose secrets and variables supply the values
        type: string
        required: false
        default: dev

      common-ref:
        description: Branch or tag of common-pipeline to take maven/settings.xml from
        type: string
        required: false
        default: main

      java-version:
        description: Java version
        type: string
        required: false
        default: '17'

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish MuleSoft Application
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout common-pipeline
        uses: actions/checkout@v4
        with:
          repository: GayathriNuthalapati/common-pipeline
          ref: ${{ inputs.common-ref }}
          path: common
          token: ${{ secrets.COMMON_REPO_TOKEN || github.token }}

      - name: Verify Maven settings
        run: |
          ls -l common/.github/workflows/maven/settings.xml

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Build and publish to Exchange
        run: |
          mvn --version
          mvn --batch-mode -e clean deploy \
            --settings common/.github/workflows/maven/settings.xml \
            -DskipMunitTests \
            -Dbusiness.group.id="${{ vars.BUSINESS_GROUP_ID }}"
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(find target -maxdepth 1 -name '*.jar' ! -name '*-*.jar' | head -1)

          if [ -z "$artifactName1" ]; then
            artifactName1=$(find target -maxdepth 1 -name '*.jar' | head -1)
          fi

          if [ -z "$artifactName1" ]; then
            echo "No JAR artifact found in target/"
            exit 1
          fi

          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2="${artifactName1%.jar}-${commitHash}.jar"

          mv "$artifactName1" "$artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar
          if-no-files-found: error

  deploy:
    name: Deploy to ${{ vars.ANYPOINT_ENVIRONMENT || inputs.environment }}
    needs: build
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout common-pipeline
        uses: actions/checkout@v4
        with:
          repository: GayathriNuthalapati/common-pipeline
          ref: ${{ inputs.common-ref }}
          path: common
          token: ${{ secrets.COMMON_REPO_TOKEN || github.token }}

      - name: Verify Maven settings
        run: |
          ls -l common/.github/workflows/maven/settings.xml

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Deploy to Anypoint Platform
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          BUSINESS_GROUP_ID: ${{ vars.BUSINESS_GROUP_ID }}
          ANYPOINT_ENVIRONMENT: ${{ secrets.ANYPOINT_ENVIRONMENT }}
          ENV_CLIENT_ID: ${{ secrets.ENV_CLIENT_ID }}
          ENV_CLIENT_SECRET: ${{ secrets.ENV_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          MULE_ENV: ${{ secrets.MULE_ENV }}
          APP_NAME: ${{ secrets.APP_NAME }}
        run: |
          artifactName=$(find artifacts -maxdepth 1 -name '*.jar' | head -1)

          if [ -z "$artifactName" ]; then
            echo "No downloaded JAR artifact found"
            exit 1
          fi

          mvn --batch-mode mule:deploy \
            --settings common/.github/workflows/maven/settings.xml \
            -Dmule.artifact="$artifactName" \
            -Dbusiness.group.id="$BUSINESS_GROUP_ID" \
            -Dca.client.id="$CA_CLIENT_ID" \
            -Dca.client.secret="$CA_CLIENT_SECRET" \
            -Dch.environment="$ANYPOINT_ENVIRONMENT" \
            -Dplatform.client.id="$ENV_CLIENT_ID" \
            -Dplatform.client.secret="$ENV_CLIENT_SECRET" \
            -Dmule.key="$ENCRYPTION_KEY" \
            -Denv="$MULE_ENV" \
            -Dapplication.name="$APP_NAME"

